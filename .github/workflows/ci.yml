# The gate this repo already has, run on every push: lint, types, and every package's own tests.
# The docker job is separate because it builds images and deploys contracts to anvil, which is slow
# enough that a failing unit test should not wait for it.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test run would otherwise burn an hour of runner time before anyone noticed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Contracts are Foundry; the CRE workflow package runs its tests under bun.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile
      # The packages generate what the apps import: the registrar's types and the errors ABI the
      # contracts dump. A fresh checkout has neither, so nothing can be typechecked before this.
      - run: pnpm --filter "./packages/**" run build
      - run: pnpm -w lint
      - run: pnpm -w typecheck
      # One step per package: a recursive run that hangs says nothing about which package hung.
      - run: pnpm --filter @ketsuban/registrar test
      - run: pnpm --filter @ketsuban/contracts test
      - run: pnpm --filter @ketsuban/cre-attest test
      - name: api tests
        timeout-minutes: 8
        run: pnpm --filter @ketsuban/api test
      - name: web tests
        timeout-minutes: 8
        run: pnpm --filter @ketsuban/web test
      # The browser journeys were written and then never run by CI, so a UI change could break them
      # for days without anyone noticing.
      - name: install browsers
        run: pnpm --filter @ketsuban/web exec playwright install --with-deps chromium
      # NEXT_PUBLIC_* values are inlined at build time, so the app cannot start without them. The
      # example file is a complete, public-by-design config; a fresh checkout has no `.env.local`.
      - name: web env for the journeys
        run: cp apps/web/.env.example apps/web/.env.local
      - name: web journeys
        timeout-minutes: 12
        run: pnpm --filter @ketsuban/web run test:e2e

  # Whether this runner can compose containers at all, as its own job.
  #
  # `e2e` brings up anvil, a deploy container and the api image. When that job fails, the reason is
  # thirty lines into a container trace inside vitest, and on a private forge the log is only readable
  # by somebody signed in — so "the stack could not start" and "a test failed" reported the same red.
  # As a separate job the two are separate statuses, which the commit-status API reports without a
  # login, and this one costs seconds.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: the daemon the e2e job composes its stack with
        run: |
          echo "runner: $(uname -srm)"
          command -v docker >/dev/null || {
            echo "::error::no docker on this runner"
            exit 1
          }
          docker version --format '{{.Server.Version}}' || {
            echo "::error::docker is installed but its daemon is not reachable"
            exit 1
          }
          docker compose version || {
            echo "::error::docker has no compose plugin, which is what brings the stack up"
            exit 1
          }

  # Everything the e2e job does before it runs a test, as its own status.
  #
  # The runner turned out to have docker, so the stack not starting was not the reason. This covers
  # the rest of the prefix — a recursive checkout, a lockfile install, the package build the suite
  # imports, and whether compose can even read the file it brings the stack up from. Green here and
  # red next door means the suite itself is what fails, which is the one thing worth reading a log for.
  e2e-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: the submodule the deploy container compiles against
        run: test -f packages/contracts/lib/forge-std/src/Test.sol || (echo "::error::forge-std is not checked out" && exit 1)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ketsuban/registrar build
      - name: the stack this suite composes
        run: docker compose -f apps/api/docker-compose.e2e.yml config --quiet
      # The suite's first act is `compose up -d --build`, and the job next door dies at about the
      # moment that starts. Building here says whether the images are what fails, which is the half a
      # log would otherwise be needed for.
      - name: the images it builds
        run: docker compose -f apps/api/docker-compose.e2e.yml build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # forge-std is a submodule, and the deploy container compiles the contracts including their
      # tests. Without this the container fails in half a second on `forge-std/Test.sol`.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Foundry here on purpose: forge runs inside the deploy container, the ABIs it needs are checked
      # in, and the toolchain download is the one step of this job that fails on its own.
      - run: pnpm --filter @ketsuban/registrar build
      # anvil, the contracts deployed from this source, and the api image: the whole loop from outside.
      - run: pnpm --filter @ketsuban/api test:e2e
